name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build
        env:
          PUBLIC_SITE_URL: https://pet.blog.uribou.me
          SANITY_FALLBACK_MODE: always

      - name: Test
        run: pnpm test

      - name: Verify generated SEO files
        run: pnpm test:seo
        env:
          PUBLIC_SITE_URL: https://pet.blog.uribou.me
